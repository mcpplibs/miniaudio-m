name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mcpp:
    name: mcpp (${{ matrix.os }}, ${{ matrix.toolchain }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     toolchain: 'gcc@16.1.0' }
          - { os: ubuntu-24.04,     toolchain: 'llvm@23.1.3' }
          - { os: ubuntu-24.04-arm, toolchain: 'gcc@16.1.0' }
          - { os: macos-15,         toolchain: 'llvm@23.1.3' }
          - { os: windows-2025,     toolchain: 'llvm@23.1.3' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      XLINGS_NON_INTERACTIVE: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mwrap identity and bilingual README contract
        run: python3 tools/check_mwrap_release.py

      - name: Install Xlings (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://raw.githubusercontent.com/openxlings/xlings/refs/heads/main/tools/other/quick_install.sh | bash
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"

      - name: Install Xlings (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.ps1 | iex
          "$env:USERPROFILE\.xlings\subos\current\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install project tools (.xlings.json)
        run: |
          for attempt in 1 2 3; do
            xlings update > /dev/null 2>&1 || true
            if xlings install; then break; fi
            [ "$attempt" = 3 ] && exit 1
            sleep 30
          done
          mcpp --version

      - name: Select the toolchain
        run: |
          name="${{ matrix.toolchain }}"
          mcpp toolchain install "${name%@*}" "${name#*@}"
          mcpp toolchain default "$name"

      # Until mcpp-index publishes compat.miniaudio compiled at gnu11
      # (mcpplibs/mcpp-index#609), the compat namespace of this checkout's
      # manifests resolves from that PR's branch, as an unchanged namespace
      # view of its descriptors. Once published, this step does nothing.
      - name: Candidate compat index (only while compat.miniaudio's gnu11 build is unpublished)
        run: python3 tools/candidate_index.py --ci

      - name: Build the modules
        run: mcpp build

      - name: Tests (the API on the Null backend, every macro mapping against the header, header mixing)
        run: mcpp test

      - name: Export audit (the generated sources are fresh; every declaration and macro of miniaudio.h on this target)
        run: python3 tools/check_exports.py

      - name: The audio file tool written against the module (tone, info, convert of WAV, FLAC and MP3)
        run: python3 tools/run_examples.py

  # The Web: wasm32-emscripten (emsdk and node through mcpp), miniaudio's Web
  # Audio backend compiled and linked; the tests run under node, which has no
  # AudioContext, so the backend's probe reports no device there and every
  # device-free test runs as on the other rows.
  web:
    name: mcpp (wasm32-emscripten, node)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      XLINGS_NON_INTERACTIVE: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Xlings
        run: |
          curl -fsSL https://raw.githubusercontent.com/openxlings/xlings/refs/heads/main/tools/other/quick_install.sh | bash
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"

      - name: Install project tools (.xlings.json)
        run: |
          for attempt in 1 2 3; do
            xlings update > /dev/null 2>&1 || true
            if xlings install; then break; fi
            [ "$attempt" = 3 ] && exit 1
            sleep 30
          done
          mcpp --version

      - name: Candidate compat index (only while compat.miniaudio's gnu11 build is unpublished)
        run: python3 tools/candidate_index.py --ci

      - name: Build the modules for the Web (the Web Audio backend)
        run: mcpp build --target wasm32-emscripten

      - name: Tests under node (Web Audio and Custom enabled, no Null backend; the engine without threads)
        run: mcpp test --target wasm32-emscripten

      - name: Export audit on the Web target
        run: python3 tools/check_exports.py
